opacity":0.5,"fill":true,"fillColor":["#9e2b25","#9e2b25","#9e2b25","#9e2b25","#9e2b25","#9e2b25","#9e2b25"],"fillOpacity":0.55,"smoothFactor":1,"noClip":false},["<div style='width:250px;font-family:Georgia,serif;'>\n       <img src='img/ungaria.jpg' style='width:100%;height:140px;object-fit:cover;display:block;border-bottom:2px solid #8a6d3b;filter:sepia(0.3) contrast(1.05);'>\n       <div style='padding:10px 13px 13px;'>\n         <span style='display:inline-block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:2px;color:#fff;background:#9e2b25;margin-bottom:7px;'>Blocul de Est<\/span>\n         <h3 style='margin:0 0 5px;font-size:18px;color:#2b2118;'>Ungaria<\/h3>\n         <p style='margin:0;font-size:13px;line-height:1.5;color:#4a3c2c;'>Republica Populara Ungara, membra a Pactului de la Varsovia. In 1956 a izbucnit Revolutia maghiara, reprimata sangeros de trupele sovietice.<\/p>\n       <\/div>\n     <\/div>","<div style='width:250px;font-family:Georgia,serif;'>\n       <img src='img/romania.jpg' style='width:100%;height:140px;object-fit:cover;display:block;border-bottom:2px solid #8a6d3b;filter:sepia(0.3) contrast(1.05);'>\n       <div style='padding:10px 13px 13px;'>\n         <span style='display:inline-block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:2px;color:#fff;background:#9e2b25;margin-bottom:7px;'>Blocul de Est<\/span>\n         <h3 style='margin:0 0 5px;font-size:18px;color:#2b2118;'>Romania<\/h3>\n         <p style='margin:0;font-size:13px;line-height:1.5;color:#4a3c2c;'>Republica Socialista Romania, condusa de Gheorghe Gheorghiu-Dej si apoi de Nicolae Ceausescu. Membra a Pactului de la Varsovia, dar cu o politica externa relativ independenta de Moscova.<\/p>\n       <\/div>\n     <\/div>","<div style='width:250px;font-family:Georgia,serif;'>\n       <img src='img/bulgaria.jpg' style='width:100%;height:140px;object-fit:cover;display:block;border-bottom:2px solid #8a6d3b;filter:sepia(0.3) contrast(1.05);'>\n       <div style='padding:10px 13px 13px;'>\n         <span style='display:inline-block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:2px;color:#fff;background:#9e2b25;margin-bottom:7px;'>Blocul de Est<\/span>\n         <h3 style='margin:0 0 5px;font-size:18px;color:#2b2118;'>Bulgaria<\/h3>\n         <p style='margin:0;font-size:13px;line-height:1.5;color:#4a3c2c;'>Republica Populara Bulgaria, considerata cel mai fidel aliat al URSS. Condusa timp de decenii de Todor Jivkov.<\/p>\n       <\/div>\n     <\/div>","<div style='width:250px;font-family:Georgia,serif;'>\n       <img src='img/polonia.jpg' style='width:100%;height:140px;object-fit:cover;display:block;border-bottom:2px solid #8a6d3b;filter:sepia(0.3) contrast(1.05);'>\n       <div style='padding:10px 13px 13px;'>\n         <span style='display:inline-block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:2px;color:#fff;background:#9e2b25;margin-bottom:7px;'>Blocul de Est<\/span>\n         <h3 style='margin:0 0 5px;font-size:18px;color:#2b2118;'>Polonia<\/h3>\n         <p style='margin:0;font-size:13px;line-height:1.5;color:#4a3c2c;'>Republica Populara Polona; la Varsovia s-a semnat in 1955 tratatul Pactului. Aici a aparut in 1980 miscarea sindicala Solidaritatea.<\/p>\n       <\/div>\n     <\/div>","<div style='width:250px;font-family:Georgia,serif;'>\n       <img src='img/cehoslovacia.jpg' style='width:100%;height:140px;object-fit:cover;display:block;border-bottom:2px solid #8a6d3b;filter:sepia(0.3) contrast(1.05);'>\n       <div style='padding:10px 13px 13px;'>\n         <span style='display:inline-block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:2px;color:#fff;background:#9e2b25;margin-bottom:7px;'>Blocul de Est<\/span>\n         <h3 style='margin:0 0 5px;font-size:18px;color:#2b2118;'>Cehoslovacia<\/h3>\n         <p style='margin:0;font-size:13px;line-height:1.5;color:#4a3c2c;'>Republica Socialista Cehoslovaca. In 1968, incercarea de reforma din timpul Primaverii de la Praga a fost zdrobita de invazia trupelor Pactului de la Varsovia.<\/p>\n       <\/div>\n     <\/div>","<div style='width:250px;font-family:Georgia,serif;'>\n       <img src='img/urss.jpg' style='width:100%;height:140px;object-fit:cover;display:block;border-bottom:2px solid #8a6d3b;filter:sepia(0.3) contrast(1.05);'>\n       <div style='padding:10px 13px 13px;'>\n         <span style='display:inline-block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:2px;color:#fff;background:#9e2b25;margin-bottom:7px;'>Blocul de Est<\/span>\n         <h3 style='margin:0 0 5px;font-size:18px;color:#2b2118;'>URSS<\/h3>\n         <p style='margin:0;font-size:13px;line-height:1.5;color:#4a3c2c;'>Uniunea Sovietica, superputerea care domina Blocul de Est si conducea Pactul de la Varsovia, cu capitala la Moscova.<\/p>\n       <\/div>\n     <\/div>","<div style='width:250px;font-family:Georgia,serif;'>\n       <img src='img/rdg.jpg' style='width:100%;height:140px;object-fit:cover;display:block;border-bottom:2px solid #8a6d3b;filter:sepia(0.3) contrast(1.05);'>\n       <div style='padding:10px 13px 13px;'>\n         <span style='display:inline-block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:2px;color:#fff;background:#9e2b25;margin-bottom:7px;'>Blocul de Est<\/span>\n         <h3 style='margin:0 0 5px;font-size:18px;color:#2b2118;'>Germania de Est (RDG)<\/h3>\n         <p style='margin:0;font-size:13px;line-height:1.5;color:#4a3c2c;'>Republica Democrata Germana, stat satelit sovietic. In 1961 a ridicat Zidul Berlinului pentru a opri exodul spre Vest.<\/p>\n       <\/div>\n     <\/div>"],null,null,{"interactive":false,"permanent":false,"direction":"auto","opacity":1,"offset":[0,0],"textsize":"10px","textOnly":false,"className":"","sticky":true},{"weight":
